name: Cópia de segurança

# Todos os domingos: exporta os dados do Supabase, encripta-os com a chave BACKUP_KEY (AES-256)
# e guarda o ficheiro encriptado nesta execução durante 90 dias. Sem a chave, o ficheiro é ilegível.
on:
  schedule:
    - cron: '23 4 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/backup.yml']

permissions:
  contents: read

jobs:
  copia:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar chave
        run: |
          if [ ${#BACKUP_KEY} -lt 16 ]; then echo "::error::Falta o segredo BACKUP_KEY (mínimo 16 caracteres). Nenhuma cópia sem encriptação é criada."; exit 1; fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.56.1
      - name: Exportar e encriptar
        run: |
          umask 077
          supabase link --project-ref "$REF" > /dev/null
          supabase db dump --linked --data-only --schema public,auth -f /tmp/dados.sql > /dev/null
          supabase db dump --linked --schema public -f /tmp/estrutura.sql > /dev/null
          D=$(date -u +%Y-%m-%d)
          tar -C /tmp -czf /tmp/copia.tgz dados.sql estrutura.sql
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in /tmp/copia.tgz -out "copia-transportes-$D.tgz.enc" -pass env:BACKUP_KEY
          shred -u /tmp/dados.sql /tmp/estrutura.sql /tmp/copia.tgz
          echo "D=$D" >> "$GITHUB_ENV"
          ls -la copia-transportes-*.enc | awk '{print "Cópia encriptada:", $5, "bytes"}'
      - uses: actions/upload-artifact@v4
        with:
          name: copia-transportes-${{ env.D }}
          path: copia-transportes-*.tgz.enc
          retention-days: 90
