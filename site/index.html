<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#0b6b3a">
<link rel="manifest" href="manifest.json">

<style>
:root{--v:#0b6b3a;--v2:#0e8a4b;--vc:#e7f4ec;--txt:#17201b;--mut:#66736b;--bd:#dfe6e1;--bg:#f5f7f6;--am:#b7791f;--amc:#fdf3e1;--vm:#b42318;--vmc:#fdecea;--az:#1d5fa8;--azc:#e8f0fb}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:16px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 110px}
header.top{background:var(--v);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
header.top .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
header.top h1{font-size:17px;margin:0;flex:1;font-weight:650}
header.top small{opacity:.8;font-weight:400;display:block;font-size:12px}
.lnk{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:4px}
.demo{background:#fff8e1;color:#7a5a00;font-size:12.5px;text-align:center;padding:6px 10px;border-bottom:1px solid #f1e2b3}
.tabs{background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:52px;z-index:4;overflow-x:auto}
.tabs .in{max-width:640px;margin:0 auto;display:flex;width:100%}
.tabs button{flex:1;border:0;background:none;padding:12px 6px;font-weight:600;color:var(--mut);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-size:14.5px}
.tabs button.on{color:var(--v);border-bottom-color:var(--v)}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:22px 2px 8px;font-weight:650;display:flex;align-items:center;gap:8px}
h2 .n{background:var(--bd);color:var(--txt);border-radius:10px;padding:1px 8px;font-size:12px;letter-spacing:0}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:13px 14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.mut{color:var(--mut);font-size:14px}
.sm{font-size:13px}
.b{font-weight:650}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--v);color:#fff}
.btn:active{transform:scale(.98)}
.btn.sec{background:#fff;color:var(--v);border:1.5px solid var(--v)}
.btn.gh{background:var(--bg);color:var(--txt);border:1px solid var(--bd)}
.btn.red{background:#fff;color:var(--vm);border:1.5px solid #f1b7b0}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:9px}
.btn.full{width:100%;padding:14px}
.btn.mag{background:linear-gradient(135deg,#0b6b3a,#1d8a5a)}
.btn:disabled{opacity:.45}
.chip{display:inline-block;border-radius:20px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.c-v{background:var(--vc);color:var(--v)}.c-a{background:var(--amc);color:var(--am)}.c-r{background:var(--vmc);color:var(--vm)}.c-g{background:var(--bg);color:var(--mut);border:1px solid var(--bd)}.c-b{background:var(--azc);color:var(--az)}
label.f{display:block;font-size:13.5px;font-weight:600;color:var(--mut);margin:12px 0 5px}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],input[type=tel],select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--bd);border-radius:10px;background:#fff;color:var(--txt)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--v2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--bd);border-radius:10px;margin-bottom:7px;background:#fff;cursor:pointer}
.chk.on{border-color:var(--v2);background:var(--vc)}
.chk.dis{opacity:.55;cursor:not-allowed}
.chk input{width:20px;height:20px;accent-color:var(--v)}
.login{max-width:380px;margin:9vh auto 0;padding:0 18px}
.logo{width:68px;height:68px;border-radius:50%;background:var(--v);color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 12px}
.err{color:var(--vm);font-size:14px;margin-top:10px;min-height:18px}
.bar{height:8px;background:var(--bg);border-radius:8px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--v2)}
.bar.full i{background:var(--vm)}
.pax{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bg)}
.pax:first-of-type{border-top:0}
.pax.x{text-decoration:line-through;color:var(--mut)}
.hora{font-weight:750;font-size:19px;color:var(--v);min-width:56px}
.sel{outline:2.5px solid var(--v2);background:var(--vc)}
.fab{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.fab .in{max-width:640px;margin:0 auto;display:flex;gap:8px;align-items:center}
.datenav{display:flex;align-items:center;gap:8px;margin-top:14px}
.datenav .d{flex:1;text-align:center;font-weight:700;font-size:17px}
.datenav button{width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:#fff;font-size:19px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:21px}
.stat span{font-size:12px;color:var(--mut)}
.filt{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.filt button{border:1px solid var(--bd);background:#fff;border-radius:20px;padding:6px 13px;font-size:14px;cursor:pointer}
.filt button.on{background:var(--v);color:#fff;border-color:var(--v)}
.ov{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 6px;font-size:18px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1f2a24;color:#fff;padding:10px 16px;border-radius:10px;font-size:14.5px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
pre.msg{white-space:pre-wrap;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px;font-family:inherit;font-size:14.5px;margin:10px 0}
.empty{text-align:center;color:var(--mut);padding:22px 10px;font-size:14.5px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.atl{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px}
.sw{display:flex;align-items:center;gap:6px;font-size:13.5px;white-space:nowrap}
.sw input{width:18px;height:18px;accent-color:var(--v)}
.warn{background:var(--amc);color:#7a4f0a;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.ok{background:var(--vc);color:var(--v);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.rota{margin-top:8px;border-left:3px solid var(--vc);padding-left:10px}
.st{display:flex;gap:8px;padding:4px 0;font-size:14px}
.st .t{font-weight:700;min-width:44px;color:var(--v)}
.st .w{flex:1}
.up{color:var(--az);font-weight:600}.dn{color:var(--am);font-weight:600}
table.z{width:100%;border-collapse:collapse;font-size:14px}
table.z td{padding:4px 3px;border-top:1px solid var(--bg)}
table.z input{padding:6px 8px}
.lrow{display:grid;grid-template-columns:1.4fr 1fr auto auto;gap:6px;align-items:center;margin-bottom:6px}
.lrow select,.lrow input[type=text]{padding:8px}
</style>
</head>
<body>
<div id="app"></div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
/* ===================== UTILITÁRIOS ===================== */
const pad=n=>String(n).padStart(2,'0');
const isoD=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoje=()=>isoD(new Date());
const agoraHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const mesAtual=()=>hoje().slice(0,7);
const addDias=(iso,n)=>{const d=new Date(iso+'T12:00');d.setDate(d.getDate()+n);return isoD(d)};
const addMes=(m,n)=>{const [y,mm]=m.split('-').map(Number);const d=new Date(y,mm-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const DS=['dom','seg','ter','qua','qui','sex','sáb'];
const MS=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const fmtD=iso=>{const d=new Date(iso+'T12:00');return DS[d.getDay()]+', '+pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const fmtM=m=>{const [y,mm]=m.split('-');return MS[+mm-1]+' '+y};
const uid=()=>crypto.randomUUID();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const genPass=()=>{const c='abcdefghjkmnpqrstuvwxyz23456789';let s='';for(let i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];return s};
const toMin=h=>{const [a,b]=h.split(':').map(Number);return a*60+b};
const hm=m=>{m=Math.round(m);return pad(Math.floor(m/60)%24)+':'+pad(m%60)};
const CASA='Casa';

/* ===================== LIGAÇÃO AO SUPABASE ===================== */
const DOM='transportes.fayalsportclub.pt';
const sb=window.supabase.createClient(window.SB_URL,window.SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
let S={cfg:null,users:[],atletas:[],pedidos:[],viagens:[],pags:[]};
let sess=null,carregado=false;
const snake=o=>Object.fromEntries(Object.entries(o).filter(([k,v])=>v!==undefined).map(([k,v])=>[k.replace(/[A-Z]/g,c=>'_'+c.toLowerCase()),v]));
const camel=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[k.replace(/_([a-z])/g,(m,c)=>c.toUpperCase()),v]));
const pick=(o,ks)=>Object.fromEntries(ks.filter(k=>k in o).map(k=>[k,o[k]]));
const COL={pedidos:['id','atletaId','data','hora','origem','destino','obs','estado','viagemId','motivo','porAdmin','prevSobe','prevDesce'],
  viagens:['id','data','hora','nota'],atletas:['id','encId','nome','escalao','socio','transporte','inicio'],pagamentos:['atletaId','mes','metodo','data'],
  profiles:['nome','tel','freg','morada']};
const linha=(t,o)=>snake(pick(o,COL[t]));
/* executa uma escrita; se falhar, avisa e volta a carregar os dados do servidor */
async function db(q){
  const r=await q;
  if(r&&r.error){console.error(r.error);toast('Não foi possível gravar: '+(r.error.message||'erro'));await carrega();render();throw r.error}
  return r;
}
async function fn(body){
  const {data,error}=await sb.functions.invoke('admin',{body});
  if(error){let m=error.message;try{const j=await error.context.json();m=j.erro||m}catch(e){};throw new Error(m)}
  if(data&&data.erro)throw new Error(data.erro);
  return data;
}
async function carrega(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){sess=null;return}
  sess=session.user.id;
  const desde=addDias(hoje(),-90);
  const [c,pr,at,pe,vi,pa]=await Promise.all([
    sb.from('config').select('dados').eq('id',1).single(),
    sb.from('profiles').select('*'),
    sb.from('atletas').select('*'),
    sb.from('pedidos').select('*').gte('data',desde),
    sb.from('viagens').select('*').gte('data',desde),
    sb.from('pagamentos').select('*').gte('mes',addMes(mesAtual(),-14))]);
  const err=[c,pr,at,pe,vi,pa].find(r=>r.error);
  if(err){console.error(err.error);toast('Erro a carregar dados');}
  S={cfg:c.data?c.data.dados:null,users:(pr.data||[]).map(camel),atletas:(at.data||[]).map(camel),pedidos:(pe.data||[]).map(camel),
     viagens:(vi.data||[]).map(camel),pags:(pa.data||[]).map(r=>{r=camel(r);return r})};
  carregado=true;
}
const me=()=>S.users.find(u=>u.id===sess);
const atl=id=>S.atletas.find(a=>a.id===id);
const usr=id=>S.users.find(u=>u.id===id);
const valor=a=>a.socio?S.cfg.vSocio:S.cfg.vNaoSocio;
const pago=(aid,m)=>S.pags.find(p=>p.atletaId===aid&&p.mes===m);
function atraso(a){
  const m=mesAtual(),dia=new Date().getDate();
  for(const mm of [addMes(m,-2),addMes(m,-1),m]){
    if(mm<a.inicio||pago(a.id,mm))continue;
    if(mm<m)return mm;
    if(dia>S.cfg.diaLimite)return mm;
  }
  return null;
}
const ocup=v=>S.pedidos.filter(p=>p.viagemId===v.id&&p.estado==='confirmado').length;
const prazoOk=data=>data>hoje()||(data===hoje()&&agoraHM()<=S.cfg.prazo);

/* ===================== DISTÂNCIAS E ROTAS ===================== */
const zona=n=>S.cfg.zonas.find(z=>z.nome===n)||S.cfg.zonas[0];
function km(f1,f2){
  if(f1===f2)return 1;
  const a=zona(f1),b=zona(f2),L=S.cfg.anel;
  let d=Math.abs(a.pos-b.pos);d=Math.min(d,L-d);
  return d+a.ramal+b.ramal;
}
const minDe=k=>k/S.cfg.vel*60;
/* Onde fica um local, para um atleta */
function loc(nome,aid){
  if(nome===CASA){const u=usr(atl(aid).encId);return {key:'casa:'+u.id,label:'Casa '+u.nome.split(' ').slice(-1)[0],freg:u.freg||S.cfg.base,base:false,morada:u.morada,semFreg:!u.freg}}
  const l=S.cfg.locais.find(x=>x.nome===nome);
  if(l)return {key:'l:'+l.nome,label:l.nome,freg:l.freg,base:!!l.base};
  const n=nome.toLowerCase();
  const z=S.cfg.zonas.find(z=>n.includes(z.nome.toLowerCase().replace(/^horta \((.*)\)$/,'$1')));
  return {key:'o:'+nome,label:nome,freg:z?z.nome:S.cfg.base,base:false,semFreg:!z};
}
const locLabel=(nome,aid)=>nome===CASA?'Casa ('+(usr(atl(aid).encId).freg||'?')+')':nome;
/* pedido -> tarefa: 'ida' (vai para o treino/jogo) ou 'reg' (regressa de uma instalação do clube) */
function job(p){
  const o=loc(p.origem,p.atletaId),d=loc(p.destino,p.atletaId);
  return {p,id:p.id,tipo:o.base&&!d.base?'reg':'ida',h:toMin(p.hora),o,d,nome:atl(p.atletaId).nome};
}
/* melhor ordem de visita entre heurísticas simples (a ilha é um anel) */
function ordem(ini,stops,fim,lat){
  if(stops.length<2)return stops;
  const L=S.cfg.anel,p0=zona(ini).pos,cw=s=>(zona(s.freg).pos-p0+L)%L,dH=s=>km(ini,s.freg);
  const cands=[[...stops].sort((a,b)=>cw(a)-cw(b)),[...stops].sort((a,b)=>cw(b)-cw(a)),[...stops].sort((a,b)=>dH(a)-dH(b)),[...stops].sort((a,b)=>dH(b)-dH(a))];
  const near=[];let cur=ini,rest=[...stops];while(rest.length){rest.sort((a,b)=>km(cur,a.freg)-km(cur,b.freg));const s=rest.shift();near.push(s);cur=s.freg}cands.push(near);
  const cost=o=>{let c=0,acc=0,f=ini;o.forEach(s=>{c+=km(f,s.freg);acc+=c;f=s.freg});return c+km(f,fim)+(lat?0.2*acc:0)};
  return cands.sort((a,b)=>cost(a)-cost(b))[0];
}
/* simula uma viagem: parte da base (Horta) à hora 'partida' (minutos) e volta à base */
function rota(jobs,partida){
  const B=S.cfg.base;
  const grp=(arr)=>{const m=new Map();arr.forEach(([L,j,acao])=>{if(!m.has(L.key))m.set(L.key,{label:L.label,freg:L.freg,sobe:[],desce:[],pronto:0,morada:L.morada});const s=m.get(L.key);s[acao].push(j);if(acao==='sobe'&&j.tipo==='reg')s.pronto=Math.max(s.pronto,j.h)});return [...m.values()]};
  const idas=jobs.filter(j=>j.tipo==='ida'),regs=jobs.filter(j=>j.tipo==='reg');
  const f1=grp(idas.map(j=>[j.o,j,'sobe']));
  const f2=grp([...idas.map(j=>[j.d,j,'desce']),...regs.map(j=>[j.o,j,'sobe'])]).sort((a,b)=>b.desce.length-a.desce.length);
  const f3=grp(regs.map(j=>[j.d,j,'desce']));
  const v0=f2.length?f2[0].freg:B;
  const o1=ordem(B,f1,v0,false),o3=ordem(f2.length?f2[f2.length-1].freg:B,f3,B,true);
  const stops=[...o1,...f2,...o3];
  let t=partida,k=0,cur=B;
  stops.forEach(s=>{const d=km(cur,s.freg);k+=d;t+=minDe(d);if(s.pronto>t){s.espera=s.pronto-t;t=s.pronto}s.t=t;t+=S.cfg.paragem;cur=s.freg});
  const dv=km(cur,B);k+=dv;t+=minDe(dv);
  const info={};
  stops.forEach(s=>{s.sobe.forEach(j=>{(info[j.id]=info[j.id]||{}).sobe=s.t});s.desce.forEach(j=>{(info[j.id]=info[j.id]||{}).desce=s.t})});
  return {jobs,stops,km:Math.round(k),inicio:partida,fim:t,info,tipo:idas.length&&regs.length?'mista':regs.length?'reg':'ida'};
}
/* rota de uma viagem gravada */
function rotaViagem(v){
  const js=S.pedidos.filter(p=>p.viagemId===v.id&&p.estado==='confirmado').map(job);
  return js.length?rota(js,toMin(v.hora)):null;
}
/* penalizações: espera no regresso, chegada cedo ou atrasada na ida */
function avalia(r){
  const c=S.cfg;let pen=0;const av=[];
  r.jobs.forEach(j=>{const i=r.info[j.id];
    if(j.tipo==='reg'){const w=i.sobe-j.h;if(w>c.maxEspera){pen+=c.maxEspera*.3+(w-c.maxEspera)*1.5;av.push(`${j.nome.split(' ')[0]} espera ${Math.round(w)} min`)}else pen+=w*.3}
    const direto=minDe(km(j.o.freg,j.d.freg)),extra=(i.desce-i.sobe)-direto-c.paragem;if(extra>10)pen+=(extra-10)*1;
    if(j.tipo==='reg'){}
    else{const dlt=i.desce-j.h;if(dlt>1){pen+=dlt*10;av.push(`${j.nome.split(' ')[0]} chega ${Math.round(dlt)} min atrasado`)}else{const ce=-dlt;if(ce>c.maxCedo){pen+=c.maxCedo*.2+(ce-c.maxCedo)*2;av.push(`${j.nome.split(' ')[0]} chega ${Math.round(ce)} min antes`)}else pen+=ce*.2}}});
  r.pen=pen;r.avisos=av;r.score=r.km+5+pen;return r;
}

/* ===================== OTIMIZADOR (uma carrinha) ===================== */
function otimizar(dia){
  const c=S.cfg,cap=c.lugares,B=c.base;
  const fixos=S.viagens.filter(v=>v.data===dia).map(rotaViagem).filter(Boolean).map(r=>[r.inicio,r.fim]);
  const pend=S.pedidos.filter(p=>p.data===dia&&p.estado==='pendente').map(job);
  const soloDur=j=>{const r=rota([j],0);return r.info[j.id].desce};
  const chave=j=>j.tipo==='reg'?j.h:j.h-soloDur(j);
  const livre=(blocos,a,b)=>!blocos.some(([x,y])=>a<y-0.5&&b>x+0.5);
  /* encaixa a viagem na agenda da carrinha: tenta a hora ideal, ou antes/depois dos blocos ocupados */
  function encaixa(js,partida,blocos){
    const base=rota(js,partida);const dur=base.fim-base.inicio;
    const reg=js[0].tipo==='reg';
    const cands=[partida];
    blocos.forEach(([x,y])=>{if(y>partida||!reg)cands.push(y);if(!reg)cands.push(x-dur)});
    let best=null;
    cands.forEach(p=>{if(p<0||p<partida-0.5&&reg)return;let r=rota(js,p);
      const w=r.stops[0]&&r.stops[0].espera;if(reg&&w>0.5){r=rota(js,p+w)}
      if(!livre(blocos,r.inicio,r.fim))return;avalia(r);if(!best||r.score<best.score)best=r});
    return best;
  }
  /* constrói a viagem a partir de uma "semente" e de uma hora alvo; modo 'zona' só junta quem fica no caminho */
  function constroi(seed,alvo,pool,blocos,modo){
    const ok=j=>j.tipo===seed.tipo&&(seed.tipo==='reg'?(j.h<=alvo&&alvo<=j.h+c.maxEspera):(j.h>=alvo&&j.h<=alvo+c.maxCedo));
    let js=[seed];
    const partidaDe=set=>{if(seed.tipo==='reg'){const r=rota(set,0);const v=r.stops.find(s=>s.sobe.length);return alvo-(v?v.t:0)}const r=rota(set,0);const v=r.stops.find(s=>s.desce.length);return alvo-(v?v.t:0)};
    const cand=pool.filter(j=>j!==seed&&ok(j));
    const out=[];const add=()=>{const r=encaixa([...js],partidaDe(js),blocos);if(r)out.push(r)};
    add();
    while(js.length<cap){
      const r0=rota(js,0).km;let bestJ=null,bestD=1e9;
      cand.forEach(j=>{if(js.includes(j))return;const d=rota([...js,j],0).km-r0;if(d<bestD){bestD=d;bestJ=j}});
      if(!bestJ)break;
      js.push(bestJ);
      if(modo==='zona'&&bestD>c.desvio){if(modo==='zona')break}
      add();
    }
    return out;
  }
  function opcoes(seed,pool,blocos,todas){
    const alvos=[seed.h];
    if(seed.tipo==='reg')pool.forEach(j=>{if(j.tipo==='reg'&&j.h>seed.h&&j.h<=seed.h+c.maxEspera&&!alvos.includes(j.h))alvos.push(j.h)});
    const out=[];
    alvos.forEach(a=>out.push(...constroi(seed,a,pool,blocos,'todos')));
    if(!todas)return out.sort((a,b)=>(a.score+12*(0))/a.jobs.length-b.score/b.jobs.length).slice(0,1);
    return out;
  }
  function greedy(pool,blocos){
    let tot=0;pool=[...pool];blocos=[...blocos];
    while(pool.length){pool.sort((a,b)=>chave(a)-chave(b));const o=opcoes(pool[0],pool,blocos,false)[0];if(!o){tot+=500;pool.shift();continue}
      tot+=o.score;blocos.push([o.inicio,o.fim]);pool=pool.filter(j=>!o.jobs.includes(j))}
    return tot;
  }
  let pool=[...pend],blocos=[...fixos];const plano=[],falha=[];
  while(pool.length){
    pool.sort((a,b)=>chave(a)-chave(b));
    const k0=chave(pool[0]);let best=null;
    pool.filter(j=>chave(j)<=k0+1).slice(0,5).flatMap(sd=>opcoes(sd,pool,blocos,true)).forEach(o=>{const rest=pool.filter(j=>!o.jobs.includes(j));const sc=o.score+greedy(rest,[...blocos,[o.inicio,o.fim]]);if(!best||sc<best.sc)best={o,sc}});
    if(!best){falha.push(pool[0]);pool.shift();continue}
    plano.push(best.o);blocos.push([best.o.inicio,best.o.fim]);pool=pool.filter(j=>!best.o.jobs.includes(j));
  }
  plano.sort((a,b)=>a.inicio-b.inicio);
  /* referência: uma viagem por cada hora/local pedido, sem agrupar por zona */
  const g={};pend.forEach(j=>{const k=j.tipo+j.h+(j.tipo==='reg'?j.o.key:j.d.key);(g[k]=g[k]||[]).push(j)});
  let refKm=0,refN=0;Object.values(g).forEach(arr=>{for(let i=0;i<arr.length;i+=cap){refN++;refKm+=rota(arr.slice(i,i+cap),0).km}});
  return {plano,falha,refKm,refN,nPend:pend.length};
}

function sugerir(){
  const res=otimizar(diaSel);ultPlano=res;
  const kmO=res.plano.reduce((s,r)=>s+r.km,0);
  let h=`<h3>✨ Plano sugerido · ${fmtD(diaSel)}</h3>
  <div class="mut">${res.nPend} pedidos → <b>${res.plano.length} viagens · ${kmO} km</b>. Sem agrupar por zona seriam ${res.refN} viagens · ${res.refKm} km.</div>`;
  const dv=res.refN-res.plano.length,dk=res.refKm-kmO;
  if(dv>0||dk>0)h+=`<div class="ok">Poupa ${dv>0?dv+' viage'+(dv===1?'m':'ns')+' e ':''}${dk} km. Já tem em conta que só há uma carrinha.</div>`;
  res.plano.forEach((r,i)=>{
    const L=S.cfg.lugares;
    h+=`<div class="card" style="margin-top:10px"><div class="row"><div class="hora">${hm(r.inicio)}</div><div class="grow"><div class="b">${r.tipo==='reg'?'Regresso a casa':r.tipo==='ida'?'Ida para treino/jogo':'Viagem mista'}</div><div class="mut sm">${r.km} km · volta à Horta ≈${hm(r.fim)}</div></div><span class="chip ${r.jobs.length>=L?'c-r':'c-v'}">${r.jobs.length}/${L}</span></div>${htmlRota(r)}`;

    h+=`</div>`;
  });
  if(res.falha.length)h+=`<div class="warn">Não foi possível encaixar: ${res.falha.map(j=>esc(j.nome)).join(', ')}.</div>`;
  h+=`<div class="mut sm" style="margin-top:8px">Distâncias e horas são estimativas (média de ${S.cfg.vel} km/h, ${S.cfg.paragem} min por paragem). Depois de aplicar pode ajustar tudo à mão.</div>
  <div class="acts"><button class="btn gh grow" onclick="fecha()">Cancelar</button><button class="btn grow" onclick="aplicaPlano()">Aplicar ${res.plano.length} viage${res.plano.length===1?'m':'ns'}</button></div>`;

async function aplicaPlano(){
  if(!ultPlano)return;
  const novasV=[],ids=[];
  ultPlano.plano.forEach(r=>{const v={id:uid(),data:diaSel,hora:hm(r.inicio),nota:''};S.viagens.push(v);novasV.push(v);r.jobs.forEach(j=>{j.p.estado='confirmado';j.p.viagemId=v.id;ids.push(j.p.id)})});

/* grava estado/viagem dos pedidos de uma viagem e as horas previstas que os pais veem */
async function gravaViagemPedidos(vid){
  const v=S.viagens.find(x=>x.id===vid);if(!v)return;
  const ps=S.pedidos.filter(p=>p.viagemId===vid&&p.estado==='confirmado');
  const r=ps.length?rotaViagem(v):null;
  ps.forEach(p=>{const i=r&&r.info[p.id];p.prevSobe=i?hm(i.sobe):null;p.prevDesce=i?hm(i.desce):null});
  if(ps.length)await db(sb.from('pedidos').upsert(ps.map(p=>linha('pedidos',p))));
}

function atribuir(){
  const ps=[...selP].map(id=>S.pedidos.find(p=>p.id===id));
  const vs=S.viagens.filter(v=>v.data===diaSel).sort((a,b)=>a.hora.localeCompare(b.hora));
  const L=S.cfg.lugares;
  const js=ps.map(job);
  /* hora de saída sugerida para uma viagem só com estes pedidos */
  const r0=rota(js,0),regs=js.filter(j=>j.tipo==='reg');
  const off=regs.length?Math.max(...regs.map(j=>j.h-r0.info[j.id].sobe)):Math.min(...js.map(j=>j.h-r0.info[j.id].desce));
  const hSug=hm(Math.max(0,off));
  let h=`<h3>Atribuir ${ps.length} atleta${ps.length>1?'s':''}</h3><div class="mut">${ps.map(p=>esc(atl(p.atletaId).nome.split(' ')[0])+' ('+p.hora+')').join(', ')}</div>`;

  if(!vs.length)h+=`<div class="mut">Ainda não há viagens neste dia.</div>`;
  vs.forEach(v=>{const n=ocup(v),liv=L-n,ok=liv>=ps.length;
    let extra='';if(ok){const atual=rotaViagem(v);const nova=rota([...(atual?atual.jobs:[]),...js],toMin(v.hora));extra=` · +${nova.km-(atual?atual.km:0)} km`}
    h+=`<button class="chk ${ok?'':'dis'}" style="width:100%;text-align:left" ${ok?`onclick="fazAtrib('${v.id}')"`:''}><div class="hora" style="font-size:17px">${esc(v.hora)}</div><div class="grow"><div class="b">${n}/${L} ocupados</div><div class="mut">${ok?liv+' lugares livres'+extra:'Só '+liv+' lugar'+(liv===1?'':'es')+' livre'+(liv===1?'':'s')}</div></div></button>`});
  h+=`<label class="f">Ou criar nova viagem — saída da Horta</label><div class="row"><input type="time" id="nvh" value="${hSug}" style="flex:1"><button class="btn" onclick="fazAtrib(null)">Criar e atribuir</button></div><div class="mut sm" style="margin-top:4px">Hora sugerida calculada para cumprir os horários pedidos.</div>`;
  if(ps.length>L)h+=`<div class="warn">Selecionou ${ps.length} atletas e a carrinha só tem ${L} lugares.</div>`;
  h+=`<div class="acts"><button class="btn gh full" onclick="fecha()">Cancelar</button></div>`;
  sheet(h);
}

function formUser(id){
  const u=id?usr(id):null;
  fAt=u?S.atletas.filter(a=>a.encId===u.id).map(a=>({...a})):[{id:uid(),nome:'',escalao:'',socio:false,transporte:true,inicio:mesAtual()}];
  sheet(`<h3>${u?'Editar encarregado':'Novo encarregado'}</h3>
  <label class="f">Nome do encarregado</label><input type="text" id="un" value="${esc(u?u.nome:'')}" ${u?'':'oninput="if(!uu._m)uu.value=sugUser(this.value)"'}>
  <div class="two"><div><label class="f">Telemóvel</label><input type="tel" id="ut" value="${esc(u?u.tel:'')}"></div><div><label class="f">Utilizador</label><input type="text" id="uu" autocapitalize="none" value="${esc(u?u.username:'')}" oninput="this._m=1"></div></div>
  <div class="two"><div><label class="f">Freguesia</label><select id="uf"><option value="">— escolher —</option>${fregOpts(u?u.freg:'')}</select></div><div><label class="f">Morada / lugar</label><input type="text" id="um" value="${esc(u?u.morada:'')}" placeholder="Ex.: Canada do Pilar, 12"></div></div>
  <label class="f">Atletas</label><div id="uat"></div><button class="btn gh sm" onclick="lerAt();fAt.push({id:uid(),nome:'',escalao:'',socio:false,transporte:true,inicio:mesAtual()});desAt()">＋ Adicionar atleta</button>
  <datalist id="esc">${['Traquinas (fut.)','Benjamins (fut.)','Infantis (fut.)','Iniciados (fut.)','Juvenis (fut.)','Juniores (fut.)','Seniores fem. (fut.)','Minis (basq.)','Iniciados (basq.)','Cadetes (basq.)','Juniores (basq.)','Infantis (vol.)','Iniciados (vol.)','Cadetes (vol.)','Juvenis (vol.)'].map(x=>`<option value="${x}">`).join('')}</datalist>
  <div class="err" id="ue"></div>
  <div class="acts"><button class="btn gh grow" onclick="fecha()">Cancelar</button><button class="btn grow" id="ugb" onclick="gravaUser('${id||''}')">${u?'Guardar':'Criar e gerar acesso'}</button></div>`);
  desAt();
}
function sugUser(n){const p=n.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').split(/\s+/).filter(Boolean);if(!p.length)return'';let b=p[0]+(p.length>1?'.'+p[p.length-1]:''),s=b,i=2;while(S.users.some(u=>u.username===s))s=b+i++;return s}
function desAt(){uat.innerHTML=fAt.map((a,i)=>`<div class="card" style="padding:10px;margin-bottom:8px"><div class="atl"><input type="text" placeholder="Nome do atleta" value="${esc(a.nome)}" data-i="${i}" data-k="nome"><input type="text" list="esc" placeholder="Escalão" value="${esc(a.escalao)}" data-i="${i}" data-k="escalao"><button class="btn gh sm" onclick="lerAt();fAt.splice(${i},1);desAt()">✕</button></div>
  <div class="row" style="gap:16px"><label class="sw"><input type="checkbox" data-i="${i}" data-k="socio" ${a.socio?'checked':''}> Sócio (${S.cfg.vSocio} €)</label><label class="sw"><input type="checkbox" data-i="${i}" data-k="transporte" ${a.transporte?'checked':''}> Usa transporte</label></div></div>`).join('')||'<div class="mut" style="margin-bottom:8px">Sem atletas.</div>'}
function lerAt(){document.querySelectorAll('#uat [data-k]').forEach(e=>{const a=fAt[e.dataset.i];a[e.dataset.k]=e.type==='checkbox'?e.checked:e.value.trim()})}
async function gravaUser(id){
  lerAt();
  const nome=un.value.trim(),tel=ut.value.trim(),user=uu.value.trim().toLowerCase(),freg=uf.value;
  const err=t=>ue.textContent=t;
  if(!nome)return err('Indique o nome.');
  if(!/^[a-z0-9._-]{3,40}$/.test(user))return err('Utilizador: só letras minúsculas, números, ponto ou hífen (mín. 3).');
  if(!freg)return err('Indique a freguesia (é usada para otimizar as viagens).');
  if(S.users.some(u=>u.username===user&&u.id!==id))return err('Esse utilizador já existe.');
  const ats=fAt.filter(a=>a.nome);
  if(!ats.length)return err('Adicione pelo menos um atleta.');
  if(ats.some(a=>!a.escalao))return err('Indique o escalão de cada atleta.');
  ugb.disabled=true;err('A gravar…');
  let u,pass=null;
  try{
    if(id){u=usr(id);
      if(u.username!==user){await fn({acao:'username',id,username:user});u.username=user}
      Object.assign(u,{nome,tel,freg,morada:um.value.trim()});
      await db(sb.from('profiles').update(linha('profiles',u)).eq('id',id));
    }else{
      pass=genPass();
      const r=await fn({acao:'criar',username:user,password:pass,nome,tel,freg,morada:um.value.trim()});
      u={id:r.id,nome,tel,username:user,freg,role:'enc',estado:'ativo',morada:um.value.trim()};S.users.push(u);
    }
  }catch(x){ugb.disabled=false;return err(x.message)}
  const keep=ats.map(a=>a.id);
  const rem=S.atletas.filter(a=>a.encId===u.id&&!keep.includes(a.id)).map(a=>a.id);
  S.atletas=S.atletas.filter(a=>a.encId!==u.id||keep.includes(a.id));
  const linhas=ats.map(a=>{const o={id:a.id,encId:u.id,nome:a.nome,escalao:a.escalao,socio:!!a.socio,transporte:!!a.transporte,inicio:a.inicio||mesAtual()};const ex=S.atletas.find(x=>x.id===a.id);ex?Object.assign(ex,o):S.atletas.push(o);return linha('atletas',o)});
  await db(sb.from('atletas').upsert(linhas));
  if(rem.length)await db(sb.from('atletas').delete().in('id',rem));
  render();
  if(id){fecha();toast('Guardado')}else mostraCred(u,'Acesso criado',pass);
}
/* ---- DEFINIÇÕES ---- */
let fLoc=null;
function aCfg(){
  const c=S.cfg;fLoc=c.locais.map(l=>({...l}));
  return `<h2>Regras</h2><div class="card">
  <div class="two"><div><label class="f">Lugares na carrinha</label><input type="number" min="1" id="cl" value="${c.lugares}"></div><div><label class="f">Prazo p/ pedidos do dia</label><input type="time" id="cp" value="${c.prazo}"></div></div>
  <div class="two"><div><label class="f">Mensalidade sócio (€)</label><input type="number" min="0" id="cs" value="${c.vSocio}"></div><div><label class="f">Não sócio (€)</label><input type="number" min="0" id="cn" value="${c.vNaoSocio}"></div></div>
  <label class="f">Pagar até ao dia do mês</label><input type="number" min="1" max="28" id="cd" value="${c.diaLimite}"><div class="mut sm" style="margin-top:4px">Depois deste dia, quem não pagou fica impedido de pedir transporte.</div></div>
  <h2>Otimizador</h2><div class="card">
  <div class="two"><div><label class="f">Espera máx. no regresso (min)</label><input type="number" min="0" id="ce" value="${c.maxEspera}"></div><div><label class="f">Chegar antes, no máx. (min)</label><input type="number" min="0" id="cc" value="${c.maxCedo}"></div></div>
  <div class="mut sm" style="margin-top:4px">Ex.: com 30 min, os Iniciados que saem às 18:00 podem esperar pelos Juvenis das 18:30 e seguir na mesma viagem.</div>
  <div class="two"><div><label class="f">Velocidade média (km/h)</label><input type="number" min="10" id="cv" value="${c.vel}"></div><div><label class="f">Tempo por paragem (min)</label><input type="number" min="0" id="cpa" value="${c.paragem}"></div></div>
  <label class="f">Desvio máximo para juntar alguém «no caminho» (km)</label><input type="number" min="0" id="cdv" value="${c.desvio}">
  </div>
  <h2>Locais habituais</h2><div class="card"><div class="mut sm" style="margin-bottom:8px">Marque «Clube» nas instalações onde se treina/joga (definem o que é ida e regresso).</div><div id="lls"></div><button class="btn gh sm" onclick="lerLoc();fLoc.push({nome:'',freg:S.cfg.base,base:false});desLoc()">＋ Local</button></div>
  <h2>Distâncias no Faial</h2><div class="card"><div class="mut sm">Km aproximados ao longo da estrada regional, a partir da Horta, no sentido Pedro Miguel → Cedros → Capelo → Feteira. «Desvio» = km fora da estrada principal (ex.: Flamengos). <b>São estimativas — corrija com os valores que conhece.</b></div>
  <table class="z" style="margin-top:8px"><tr class="mut sm"><td>Freguesia</td><td style="width:70px">km</td><td style="width:70px">desvio</td><td class="mut" style="width:60px">↔ Horta</td></tr>
  ${c.zonas.map((z,i)=>`<tr><td>${esc(z.nome)}</td><td><input type="number" step="0.5" data-z="${i}" data-k="pos" value="${z.pos}"></td><td><input type="number" step="0.5" data-z="${i}" data-k="ramal" value="${z.ramal}"></td><td class="mut">${km(c.base,z.nome)} km</td></tr>`).join('')}</table>
  <label class="f">Volta completa à ilha (km)</label><input type="number" id="can" value="${c.anel}"></div>
  <button class="btn full" style="margin-top:14px" onclick="gravaCfg()">Guardar definições</button>
  <h2>Administração</h2><div class="card"><div class="mut">Palavra-passe da conta de administração</div><div class="row" style="margin-top:8px"><input type="password" id="apw" placeholder="Nova palavra-passe" style="flex:1"><button class="btn sec" onclick="mudaPassAdmin()">Alterar</button></div></div>`;
}
function desLoc(){lls.innerHTML=fLoc.map((l,i)=>`<div class="lrow"><input type="text" data-l="${i}" data-k="nome" value="${esc(l.nome)}" placeholder="Nome"><select data-l="${i}" data-k="freg">${fregOpts(l.freg)}</select><label class="sw"><input type="checkbox" data-l="${i}" data-k="base" ${l.base?'checked':''}>Clube</label><button class="btn gh sm" onclick="lerLoc();fLoc.splice(${i},1);desLoc()">✕</button></div>`).join('')}
function lerLoc(){document.querySelectorAll('#lls [data-k]').forEach(e=>{fLoc[e.dataset.l][e.dataset.k]=e.type==='checkbox'?e.checked:e.value.trim()})}
async function mudaPassAdmin(){if(apw.value.length<10)return toast('Mínimo 10 caracteres');const {error}=await sb.auth.updateUser({password:apw.value});apw.value='';toast(error?error.message:'Palavra-passe alterada')}
async function gravaCfg(){
  const c=S.cfg;lerLoc();
  c.lugares=Math.max(1,+cl.value||8);c.prazo=cp.value||'12:00';c.vSocio=+cs.value||0;c.vNaoSocio=+cn.value||0;c.diaLimite=Math.min(28,Math.max(1,+cd.value||10));
  c.maxEspera=Math.max(0,+ce.value||0);c.maxCedo=Math.max(0,+cc.value||0);c.vel=Math.max(10,+cv.value||40);c.paragem=Math.max(0,+cpa.value||0);c.desvio=Math.max(0,+cdv.value||0);
  c.anel=Math.max(10,+can.value||52);
  document.querySelectorAll('[data-z]').forEach(e=>{c.zonas[e.dataset.z][e.dataset.k]=+e.value||0});
  c.locais=fLoc.filter(l=>l.nome);
  render();await db(sb.from('config').update({dados:c}).eq('id',1));toast('Definições guardadas');
}

/* ===================== ROUTER ===================== */
function render(){
  const u=me();
  if(!sess||!u||u.estado==='suspenso'||!S.cfg)return vLogin();
  u.role==='admin'?vAdmin():vEnc();
  if(tab==='cfg'&&u.role==='admin'&&document.getElementById('lls'))desLoc();
}
(async()=>{app.innerHTML='<div class="empty" style="margin-top:30vh">A carregar…</div>';await carrega();render()})();
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&sess&&!document.getElementById('ov').classList.contains('on')){await carrega();render()}});
</script>
</body>
</html>
